# Text-only counterpart of train_deepseek_v41_vlm_MegaMoE_CSA2_full_online.yaml.
# 8 hosts x 16 dies: TP1 / CP8 / EP128 / FSDP128, GBS128, sequence length 4096.
# Preserve all 40 text layers, full text width, BF16, Muon and fused CSA2/MegaMoE/MHC/Gate.
# Vision and Encoder CP are disabled; Online JSONL text uses compact packed boundaries.
# Load local HF native quantized weights into BF16 training parameters with 384 experts.
# Engram assets must match the released hashing metadata and checkpoint table rows.
# The reference fixed routing and memory-history settings are retained for comparison.

model:
  _target_: hyper_parallel.models.deepseek_v41.adapter.validation.cropped_model.build_cropped_deepseek_v41
  # Official DeepSeek-V4.1-Flash repository; environment-specific paths are
  # intentionally supplied by the user.
  config_path: /path/to/DeepSeek-V4.1-Flash
  load_pretrained: true
  # Must contain released-size Engram metadata generated from the official assets.
  engram_assets_path: ./output/training_demo/deepseek_v41/artifacts/engram_depth_preserving_d1.json
  # Full text width and all 40 layers; retain all 384 experts.
  text_parameter_divisor: 1
  enable_vision: false
  # EP128 owns three routed experts per die; retain top-k=6.
  num_routed_experts: 384
  exercise_post_training_indexer: false
  enable_candidate_pool: false
  indexer_loss_coeff: 0.001
  # Sequence auxiliary loss; 0 disables it.
  router_aux_loss_coeff: 0.0001
  # Retain text-router load statistics and bias updates; 0 disables them.
  router_bias_update_rate: 0.001
  # Generic HyperAutoModel build options accepted by the builder.
  torch_dtype: bfloat16
  validate_placement: false
  engram_storage_backend: host #device
model_init_dtype: bfloat16

training:
  train_iters: 10
  train_samples: null
  eval_iters: 0
  # TP1/CP8 gives dense DP16; GBS128/micro1 accumulates 8 microbatches.
  # Expert parallelism redistributes tokens without reducing the DP divisor.
  global_batch_size: 128
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 1  # 当前CSA2融合算子不支持TP
  cp_size: 8
  ep_size: 128
  pp_size: 1
  sequence_parallel: true
  loss_parallel: false
  encoder_parallel:
    enabled: false
    encoder_cp_size: 1

fsdp_config:
  dp_shard_size: 128
  edp_shard_size: 1
  replicate_params: []
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: bfloat16
    cast_forward_inputs: false
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 0 #1
  backward_prefetch_depth: 0 #1
  comm_fusion: false

plan_overrides:
  - match: "model.layers.*.engram"
    module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41Engram
    replace_module:
      _target_: hyper_parallel.models.deepseek_v41.adapter.engram.host_replacement.HostEngramModule
  - match: "model.layers.*.self_attn"
    module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41Attention
    replace_module:
      _target_: >-
        hyper_parallel.components.modules.shared_compressed_dsa_attention.SharedCompressedDSAAttention
      use_fused_ops: true
  - match: "*.self_attn"
    tp_divide_attrs: [num_groups]
  - match: "*.self_attn"
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: >-
        hyper_parallel.models.deepseek_v41.adapter.distributed.shared_attention_context_parallel.deepseek_v41_shared_attention_parallel_wrapper
  # Fully declared globs create the mHC/Engram boundaries from the final
  # model tree, independent of model depth and Engram layer IDs.
  - match: "model.layers.*.*_hc"
    region_dispatch: false
    params:
      fn: {tp: replicate}
      base: {tp: replicate}
      scale: {tp: replicate}
    in_src:
      hidden_streams: {tp: replicate, cp: "shard(1)", ep: replicate}
    in_dst:
      hidden_streams: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_src:
      pre: {tp: replicate, cp: "shard(1)", ep: replicate}
      post: {tp: replicate, cp: "shard(1)", ep: replicate}
      residual: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_dst:
      pre: {tp: replicate, cp: "shard(1)", ep: replicate}
      post: {tp: replicate, cp: "shard(1)", ep: replicate}
      residual: {tp: replicate, cp: "shard(1)", ep: replicate}
  - match: "model.layers.*.*_hc"
    when: sequence_parallel
    in_src:
      hidden_streams: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
    in_dst:
      hidden_streams: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
    out_src:
      pre: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      post: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      residual: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
    out_dst:
      pre: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      post: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      residual: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
  - match: "model.layers.*.engram"
    params:
      q_weight: {tp: replicate}
      k_weight: {tp: replicate}
      embed.weight: {ep: "shard(0)"}
      wkv.weight: {tp: replicate}
  - match: "model.layers.*.engram"
    region_dispatch: false
    local_compute_fn:
      _target_: >-
        hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_engram_compute_fn
  # The fixed route matches the reference performance configuration.
  # Set fix_router=false below for learned routing in normal pretraining.
  # Native alternative: remove the MegaMoe expert replacement below and select
  # deepseek_v41_ep_compute_fn with use_grouped_gemm: true.
  - match: "model.layers.*.mlp"
    region_dispatch: false
    local_compute_fn:
      _target_: >-
        hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_megamoe_compute_fn
      fix_router: true
  # MegaMoe supports CP and TP+SP with EP>1; PP=1. Pair this replacement with its compute target above.
  - match: "model.layers.*.mlp.experts"
    module_type: transformers.models.deepseek_v4.modeling_deepseek_v4.DeepseekV4Experts
    replace_module:
      _target_: hyper_parallel.models.deepseek_v41.adapter.distributed.megamoe.DeepseekV41MegaMoeExperts
      # Source token capacity; 4096 covers the current 4K/CP8 local length of 512.
      local_num_tokens: 4096
      dispatch_mode: push  # Set to pull for GET dispatch.
  # HyperMegaMhc reuses the original fn/base/scale parameters.
  - match:
      - "model.layers.*.attn_hc"
      - "model.layers.*.ffn_hc"
    module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41PipelinedHyperConnection
    replace_module:
      _target_: hyper_parallel.models.deepseek_v41.adapter.distributed.mega_mhc.DeepseekV41HyperMegaMhc
  # MegaGate fused router: requires the multicore native build.
  - match: "model.layers.*.mlp.gate"
    module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41TopKRouter
    replace_module:
      _target_: >-
        hyper_parallel.models.deepseek_v41.adapter.distributed.mega_gate.DeepseekV41MegaGate

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full #"off"

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  training_mode: pretrain
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: /path/to/DeepSeek-V4.1-Flash
      local_files_only: true
      use_fast: true
      trust_remote_code: false
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 4096
    # Use long records that yield full 4096-token windows; short records are not aligned automatically.
    drop_ragged_tail: true
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: ./output/training_demo/deepseek_v41/llm_online_4k.jsonl
  data_config:
    # Emit compact sample boundaries through the V4.1 runtime adapter. A dense
    # [S,S] mask would be infeasible at the report's 64K/1M training lengths.
    create_attention_mask_in_dataloader: true
    labels_are_shifted: true

dataloader:
  _target_: hyper_parallel.data.batching.TokenBatchLoader
  min_buffered_samples: 1
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
    pad_to_length: 4096
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: compressed
    runtime_input_adapter:
      _target_: hyper_parallel.models.deepseek_v41.adapter.data.runtime.DeepseekV41Runtime
      # TextParallelBatch already builds these two fields. The model adapter
      # contributes only compact shared-attention packing metadata here.
      include_position_ids: false
      include_image_sequence_start: false
  # Online Mapping owns its deterministic sample and blend indices.
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.Muon
  fp32_main_params: false
  no_decay_params: [bias, norm, ln_]
  muon_config:
    muon_lr: 3.0e-5
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 3.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false #true
  checkpoint_dir: /mnt/sfsturbo/p00837370/dsv41/
  save_steps: 10
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  # Host external state requires synchronous checkpointing.
  save_extra_state_per_rank: true
  restore_from: null
  restore_optimizer: true
  restore_train_state: true
  restore_dataloader_state: true

debug:
  check_nan_inf: false
  check_dataset: null

loss_fn: null

profiler:
  enable: false
  start_step: 3
  stop_step: 4
  output_path: /mnt/sfsturbo/p00837370/dsv41/profiler
  memory: false
  with_stack: false
  rank_ids:
  - 0
memory:
  enable: true
  start_step: 0
  end_step: 2
  save_path: /mnt/sfsturbo/p00837370/dsv41/memory_snapshot
  dump_ranks:
  - 0
  stacks: all
